[project]
name = "motor-cartera"
version = "0.18.0"
description = "Motor de ingesta, validación, segmentación, decisión, priorización territorial y ruteo sintético determinista de cartera de crédito al consumo, con orquestación durable sobre PostgreSQL, un modelo histórico con Cuenta 360, un motor de pagos canónico con conciliación, el lifecycle de cobranza con atribución operativa y un Decision Engine v2 point-in-time y explicable, sobre datos sintéticos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pandera>=0.24",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.13",
    "pyarrow>=21",
    "pyshp>=3.1",
    "numpy>=1.26",
    "scipy>=1.15",
    "pyjwt[crypto]>=2.10",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.optional-dependencies]
# httpx2 es el cliente que usa el TestClient de Starlette. scikit-learn solo lo usan las pruebas, para
# comparar los GLM de predictive/model-v1 con el mismo objetivo: el servicio no lo importa.
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx2>=2.0",
    "scikit-learn>=1.6",
    "bcrypt>=4.2",
    # El verificador de tipos de src/motor_cartera (pyright, en el CI) y los stubs de pandas y de
    # SciPy, que no traen los suyos completos. Nada de esto se importa en el servicio.
    "pyright>=1.1.414",
    "pandas-stubs>=3.0.5.260914",
    "scipy-stubs>=1.18.1.1",
]

[project.scripts]
motor-cartera = "motor_cartera.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motor_cartera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Todo src/motor_cartera en modo standard, sin carpetas excluidas. Lo que falta para el modo
# estricto esta en docs/desarrollo.md.
[tool.pyright]
include = ["src/motor_cartera"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# El modo estricto, en los modulos que ya lo cumplen: que no retrocedan.
strict = [
    "src/motor_cartera/invariantes.py",
    "src/motor_cartera/atraso.py",
    "src/motor_cartera/api/limites.py",
    "src/motor_cartera/atribucion/reglas.py",
    "src/motor_cartera/db/esquema.py",
    "src/motor_cartera/decision_v2/features.py",
    "src/motor_cartera/evaluacion/reglas.py",
    "src/motor_cartera/fuentes/formatos.py",
    "src/motor_cartera/historia/identidad.py",
    "src/motor_cartera/motor_pagos/contexto.py",
    "src/motor_cartera/observabilidad/auditoria.py",
    "src/motor_cartera/predictivo/glm.py",
    "src/motor_cartera/ruteo_v2/sintetica.py",
]

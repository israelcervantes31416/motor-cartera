[project]
name = "motor-cartera"
version = "0.8.0"
description = "Motor de ingesta, validación, segmentación, decisión, priorización territorial y ruteo sintético determinista de cartera de crédito al consumo, con orquestación durable sobre PostgreSQL, un modelo histórico con Cuenta 360 y un motor de pagos canónico con conciliación, sobre datos sintéticos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pandera>=0.24",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.13",
    "pyarrow>=21",
]

[project.optional-dependencies]
# httpx2 es el cliente que usa el TestClient de Starlette.
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "httpx2>=2.0"]

[project.scripts]
motor-cartera = "motor_cartera.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motor_cartera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

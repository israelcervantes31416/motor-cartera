name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lo que el .gitignore no alcanza a ver: un archivo trackeado aunque sus reglas lo excluyan,
  # o una hoja de calculo con otro nombre. Revisa el commit que se sube, no una lista aparte.
  archivos:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Archivos trackeados
        run: python3 scripts/verificar_archivos_trackeados.py

  pruebas:
    runs-on: ubuntu-latest

    services:
      # PostgreSQL 16 con PostGIS: la migracion 0012 crea la extension, y las pruebas de la
      # geografia y de territorial/v2 la usan con referencias sinteticas diminutas. El CI no
      # descarga nada del INEGI.
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: motor
          POSTGRES_PASSWORD: motor
          POSTGRES_DB: cartera_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U motor -d cartera_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MC_DATABASE_URL: postgresql+psycopg://motor:motor@localhost:5432/cartera_test
      MC_DATABASE_URL_PRUEBAS: postgresql+psycopg://motor:motor@localhost:5432/cartera_test

    steps:
      - uses: actions/checkout@v7

      # El Python del sistema del runner esta marcado como "externally managed" (PEP 668):
      # instalar ahi con --system falla. Un entorno virtual activado evita el problema.
      # setup-uv no publica etiquetas de version mayor (no existe @v10): se fija al commit
      # de una version exacta, que ademas no se puede mover como una etiqueta. uv, en la
      # version con que se genero el uv.lock; el Dockerfile usa la misma.
      - name: uv y Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
          activate-environment: true

      # Las versiones exactas del uv.lock. Con --locked, si el lock ya no corresponde al
      # pyproject.toml el paso falla, en lugar de resolver otra vez en silencio.
      - name: Dependencias
        run: uv sync --locked --extra dev

      - name: Lint
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      # Que el esquema suba desde cero, que coincida con los modelos (si alguien cambia un
      # modelo sin migracion, `alembic check` falla) y que la migracion tambien baje.
      - name: Migraciones
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      # Las pruebas de integracion de ruteo/v2 contra OSRM de verdad: la red vial SINTETICA (19 nodos
      # inventados; no se descarga nada de OpenStreetMap) se prepara con la imagen fijada de OSRM
      # v26.9.0 y la sirve un osrm-routed en este runner. tests/test_ruteo_v2_osrm.py la usa por
      # MC_OSRM_URL_PRUEBAS y MC_RED_VIAL_PRUEBAS.
      - name: Red vial sintetica servida por OSRM
        run: |
          set -o pipefail
          motor-cartera generar-red-sintetica --destino datos/red_vial_pruebas/fuente/red_sintetica.osm
          motor-cartera preparar-red-vial datos/red_vial_pruebas/fuente/red_sintetica.osm \
            --region "Red sintetica de las pruebas" --proveedor-datos SINTETICO \
            --licencia sintetica --destino datos/red_vial_pruebas --docker | tee red.txt
          huella=$(awk '/^huella/ {print $2}' red.txt)
          sh "datos/red_vial_pruebas/$huella/preparar.sh"
          docker run -d --name osrm-pruebas -p 5005:5000 \
            -v "$PWD/datos/red_vial_pruebas/$huella:/red:ro" \
            ghcr.io/project-osrm/osrm-backend:v26.9.0-debian@sha256:8a1b1bc938412f15f9b5b32d794c4ec6bf4a85dfbbabfa0a014b70b187edb53b \
            osrm-routed --algorithm mld --verbosity WARNING --max-nearest-locations 100 /red/red.osrm
          for _ in $(seq 1 30); do
            curl -sf "http://localhost:5005/nearest/v1/driving/0,0?number=1" > /dev/null && break
            sleep 1
          done
          curl -sf "http://localhost:5005/nearest/v1/driving/0,0?number=1" | grep -q "red-vial/v1:$huella"
          echo "MC_OSRM_URL_PRUEBAS=http://localhost:5005" >> "$GITHUB_ENV"
          echo "MC_RED_VIAL_PRUEBAS=datos/red_vial_pruebas/$huella" >> "$GITHUB_ENV"

      # Contra la PostgreSQL de servicio, no contra una base simulada.
      - name: Pruebas
        run: pytest --cov=motor_cartera --cov-report=term-missing

  # La definicion de terminado, en una maquina limpia: un solo comando levanta todo
  # (PostgreSQL con PostGIS, migraciones, API y worker), se genera una cartera sintetica y su flujo
  # automatico la lleva de la ingesta al ruteo: la API la registra y el worker la ejecuta. Y un
  # escenario de cuatro cortes con sus pagos llega, en paralelo, hasta la Cuenta 360, con sus pagos
  # interpretados por el motor de pagos; y el corte oficial, con coordenadas sinteticas, pasa por
  # geografia/v1, las bases operativas, territorial/v2, campo/v2 y ruteo/v2, sobre una red vial
  # sintetica que prepara y sirve OSRM v26.9.0 con su imagen fijada. Al final, un escenario
  # predictivo pequeno, en su propia cartera, entrena predictive/model-v1 y lo usa para puntuar,
  # medir el drift y explicar una prediccion; y optimization/v1 arma, en sombra, el plan optimo de
  # su ultimo corte y uno con CAMPO sobre el corte oficial y su ruteo/v2.
  compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: docker compose up
        run: docker compose up -d --build

      # Las migraciones ya terminaron; la API y el worker siguen corriendo, cada uno en lo suyo.
      - name: Servicios
        run: docker compose ps --all

      - name: Generar una cartera sintetica
        run: docker compose exec -T api motor-cartera generar --destino datos/humo.xlsx

      # Una referencia geografica SINTETICA (un rectangulo inventado por municipio, con su clave
      # real para comparar la fuente), importada como cualquier otra, y una muestra de sus puntos:
      # con ella la cartera oficial trae coordenadas sinteticas. El CI no descarga nada del INEGI.
      - name: Importar una referencia geografica sintetica y muestrear sus puntos
        run: |
          docker compose exec -T api motor-cartera generar-geografia-sintetica \
            --destino datos/geografia/municipios.zip
          docker compose exec -T api motor-cartera importar-geografia datos/geografia/municipios.zip \
            --proveedor SINTETICO --producto "Referencia sintetica de la prueba de humo" \
            --edicion humo-v1 | tee importar.txt
          grep -q ": PUBLICADA" importar.txt
          version=$(awk '/^geografia_version_id/ {print $2}' importar.txt)
          docker compose exec -T api motor-cartera muestrear-puntos --geografia-version "$version" \
            --destino datos/geografia/puntos.json

      # Una red vial SINTETICA (19 nodos y 9 vias inventadas) dibujada dentro del municipio 21114 de
      # esa referencia, con sus puntos en la muestra: las cuentas de ese municipio caen junto a sus
      # calles, una a mas de 500 m de ellas y otra junto a un tramo sin camino. Imprime la base.
      - name: Generar una red vial sintetica en un municipio
        run: |
          set -o pipefail
          version=$(awk '/^geografia_version_id/ {print $2}' importar.txt)
          docker compose exec -T api motor-cartera generar-red-sintetica \
            --geografia-version "$version" --municipio 21114 --puntos datos/geografia/puntos.json \
            --destino datos/red_vial/fuente/red_sintetica.osm | tee red.txt
          grep -q "18 puntos de 21114" red.txt

      # La version de la red nace EN_PROCESO con su huella; preparar.sh la prepara con la imagen
      # fijada (extract, partition y customize), se publica con su manifiesto verificado, y el
      # servicio osrm (perfil ruteo) la sirve, sin puerto publicado. El worker solo toma trabajos
      # RUTEO_V2 cuando su OSRM responde, y la red que declara es la publicada.
      - name: Preparar, publicar y servir la red vial
        run: |
          set -o pipefail
          docker compose exec -T api motor-cartera preparar-red-vial \
            datos/red_vial/fuente/red_sintetica.osm --region "Red sintetica de la prueba de humo" \
            --proveedor-datos SINTETICO --licencia sintetica --docker | tee preparar.txt
          huella=$(awk '/^huella/ {print $2}' preparar.txt)
          sh "datos/red_vial/$huella/preparar.sh"
          docker compose exec -T api motor-cartera registrar-red-vial "datos/red_vial/$huella" \
            | tee registrar.txt
          grep -q ": PUBLICADA" registrar.txt
          MC_RED_VIAL_HUELLA="$huella" docker compose --profile ruteo up -d --wait osrm
          docker compose exec -T worker motor-cartera registrar-red-vial "datos/red_vial/$huella" \
            --verificar-backend | tee backend.txt
          grep -q "el backend declara esta red" backend.txt

      # La cartera oficial (cartera/v2, 93 columnas) con su hoja CARRIER, en el perfil mas pequeno,
      # con coordenadas sinteticas en las proporciones de omision, y los pagos (pagos/v1, 23
      # columnas) de la semana que termina en su corte.
      - name: Generar una cartera oficial sintetica y sus pagos
        run: >-
          docker compose exec -T api motor-cartera generar-oficial --destino datos --perfil XS
          --formato zip --fecha-corte 2026-09-30 --puntos datos/geografia/puntos.json

      # Cuatro cortes semanales de una misma cartera y los pagos entre ellos, con otra semilla: sus
      # cuentas no son las de la cartera oficial, y sus cortes son posteriores al de ella.
      - name: Generar un escenario longitudinal
        run: >-
          docker compose exec -T api motor-cartera generar-escenario --destino datos/escenario
          --perfil XS --cortes 4 --primer-corte 2026-10-07 --semilla 7 --formato zip

      # Con --campo tambien planea campo/v2 sobre el corte oficial, con --ruteo rutea por la red
      # vial un plan propio en la base de la red, y con --analytics analiza la cohorte del corte con
      # analytics/v1; deja en humo.txt la configuracion de campo, el plan, la ejecucion de ruteo/v2 y
      # la de analytics/v1. Con pipefail, tee no oculta un fallo. La base va unida a su opcion: su
      # longitud es negativa, y separada, argparse la toma por otra opcion.
      - name: Prueba de humo por la API
        run: |
          set -o pipefail
          red=$(awk '/^red_vial_version_id/ {print $2}' registrar.txt)
          base=$(awk '/^base/ {print $2","$3}' red.txt)
          python3 scripts/prueba_de_humo.py datos/humo.xlsx \
            --oficial datos/cartera_oficial_2026-09-30.zip --corte 2026-09-30 \
            --pagos datos/pagos_oficial_2026-09-24_2026-09-30.zip \
            --escenario datos/escenario --geografia --campo \
            --ruteo "$red" --base-ruteo="$base" --analytics | tee humo.txt

      # La historia de cada dataset conformado se abrio en la misma transaccion que el: el backfill
      # no encuentra ninguno sin historia, ni ninguno con solo ejecuciones fallidas.
      - name: Backfill de la historia
        run: |
          docker compose exec -T worker motor-cartera backfill-historia --dry-run | tee backfill.txt
          grep -q "sin historia: 0" backfill.txt
          grep -q "solo con ejecuciones FALLIDA: 0" backfill.txt

      # Y la interpretacion de cada ventana de pagos se abrio con la historia que publico sus pagos
      # observados: el backfill del motor no encuentra ninguno sin interpretacion vigente, ni ninguna
      # ventana cuya interpretacion haya fallado.
      - name: Backfill del motor de pagos
        run: |
          docker compose exec -T worker motor-cartera backfill-motor-pagos --dry-run | tee motor.txt
          grep -q "Pagos observados sin interpretacion vigente: 0" motor.txt
          grep -q "solo con ejecuciones FALLIDA: 0" motor.txt
          grep -q "con una reinterpretacion FALLIDA despues de su vigente: 0" motor.txt

      # La prueba de humo evaluo las promesas de la cartera a la fecha de su corte: el backfill del
      # lifecycle ya no tiene nada que evaluar a esa fecha.
      - name: Backfill del lifecycle
        run: |
          docker compose exec -T worker motor-cartera backfill-lifecycle --as-of 2026-09-30 \
            --dry-run | tee lifecycle.txt
          grep -q "Evaluaciones pendientes: 0" lifecycle.txt

      # Y atribuyo la ventana de sus pagos: el backfill de la atribucion la encuentra al dia, y
      # ninguna atribucion fallo.
      - name: Backfill de la atribucion
        run: |
          docker compose exec -T worker motor-cartera backfill-atribucion --dry-run | tee atribucion.txt
          grep -q "al dia con atribucion/v1: 1" atribucion.txt
          grep -q "solo con atribuciones FALLIDA: 0" atribucion.txt

      # Y decidio el corte oficial con decision/v2, en paralelo a decision/v1. En modo sombra,
      # contra la decision/v1 de su corrida: un diagnostico de diferencias, no un juicio de calidad.
      - name: Decision v2 en sombra
        run: |
          docker compose exec -T worker motor-cartera comparar-decisiones --corte 2026-09-30 \
            | tee sombra.txt
          grep -q "no un juicio de calidad" sombra.txt

      # Y planeo campo/v2 para el dia siguiente al corte: el backfill, con la misma configuracion
      # y la misma fecha declarada, lo encuentra ya planeado y no pide nada. El resumen y la
      # exportacion del plan salen por la linea de comandos.
      - name: Backfill, resumen y exportacion de campo/v2
        run: |
          set -o pipefail
          configuracion=$(awk '/^configuracion_campo_version_id/ {print $2}' humo.txt)
          plan=$(awk '/^campo_run_id/ {print $2}' humo.txt)
          docker compose exec -T worker motor-cartera backfill-campo-v2 \
            --configuracion "$configuracion" --fecha-operacion 2026-10-01 --dry-run | tee campo.txt
          grep -q "ya planeados: 1" campo.txt
          grep -q "Planes pendientes: 0" campo.txt
          grep -q "cortes ambiguos (no se planean): 0" campo.txt
          docker compose exec -T worker motor-cartera resumen-campo-v2 --plan "$plan" \
            | tee resumen.txt
          grep -q "no factibilidad vial" resumen.txt
          docker compose exec -T worker motor-cartera exportar-plan-campo --plan "$plan" \
            --destino datos/plan_campo.csv

      # Y ruteo por la red vial el plan de su base: el resumen sale por la linea de comandos. El
      # backfill sobre la misma red, con la fecha declarada, lo encuentra ya ruteado; el plan de la
      # seccion de campo (con bases lejos de la red) sigue pendiente: se encola una vez, y despues
      # ya no falta nada.
      - name: Resumen y backfill de ruteo/v2
        run: |
          set -o pipefail
          red=$(awk '/^red_vial_version_id/ {print $2}' registrar.txt)
          ruteo=$(awk '/^ruteo_run_id/ {print $2}' humo.txt)
          docker compose exec -T worker motor-cartera resumen-ruteo-v2 --ejecucion "$ruteo" \
            | tee ruteo.txt
          grep -q "no una ruta optima" ruteo.txt
          backfill="motor-cartera backfill-ruteo-v2 --red-vial-version $red --fecha-operacion 2026-10-01"
          docker compose exec -T worker $backfill --dry-run | tee backfill_ruteo.txt
          grep -q "ya ruteados: 1" backfill_ruteo.txt
          grep -q "Ejecuciones pendientes: 1" backfill_ruteo.txt
          docker compose exec -T worker $backfill | tee encolar_ruteo.txt
          grep -q "Se encolaron 1 trabajos RUTEO_V2" encolar_ruteo.txt
          docker compose exec -T worker $backfill --dry-run | tee backfill_ruteo_2.txt
          grep -q "Ejecuciones pendientes: 0" backfill_ruteo_2.txt

      # Y analizo la cohorte del corte oficial con analytics/v1: el resumen y la exportacion salen
      # por la linea de comandos. El backfill del mismo corte no elige entre las tres territorial/v2
      # que la prueba publico sobre la misma geografia: lo reporta ambiguo y no pide nada. Sin
      # territorial, campo ni ruteo, el manifiesto que se construye no es ambiguo: se escribe sin
      # analizar nada, y analizar-cobranza lo analiza en primer plano.
      - name: Resumen, exportacion, manifiesto y backfill de analytics/v1
        run: |
          set -o pipefail
          analytics=$(awk '/^analytics_run_id/ {print $2}' humo.txt)
          docker compose exec -T worker motor-cartera resumen-analytics --ejecucion "$analytics" \
            | tee analytics.txt
          grep -q "0 sin cuadrar" analytics.txt
          grep -q "no prueba causalidad" analytics.txt
          docker compose exec -T worker motor-cartera exportar-analytics --ejecucion "$analytics" \
            --formato parquet --destino datos/analytics.parquet | tee exportar.txt
          grep -q "suprimidos, sin valor" exportar.txt
          opciones="--modo OPERATIVO --zona America/Mexico_City --granularidad DIA"
          docker compose exec -T worker motor-cartera backfill-analytics $opciones --horizonte 2 \
            --desde 2026-09-30 --hasta 2026-09-30 --dry-run | tee backfill_analytics.txt
          grep -q "2026-09-30: ambiguo en TERRITORIAL_V2" backfill_analytics.txt
          grep -q "Ejecuciones pendientes: 0" backfill_analytics.txt
          docker compose exec -T worker motor-cartera construir-manifiesto-analytics $opciones \
            --corte 2026-09-30 --as-of 2026-10-01 --sin TERRITORIAL_V2 --sin CAMPO_V2 \
            --sin RUTEO_V2 --destino datos/manifiesto_analytics.json | tee manifiesto.txt
          grep -q "No se inicio ningun analisis" manifiesto.txt
          docker compose exec -T worker motor-cartera analizar-cobranza \
            --manifiesto datos/manifiesto_analytics.json | tee analizar.txt
          grep -q "EXITOSA (ANALYTICS_PUBLICADA)" analizar.txt

      # predictive/model-v1 sobre su propio escenario sintetico (escenario-predictivo/v1, con reglas
      # de senal publicas y fijas), en su propia cartera, despues de todo lo anterior: 600 cuentas y
      # 20 cortes semanales con sus pagos y su lifecycle, cargados semana por semana por el
      # pipeline de siempre, con la frontera de conocimiento de cada corte. El manifiesto se
      # propone sin entrenar nada; la prueba de humo lo entrena por la API y el worker lo publica,
      # puntua el ultimo corte, mide su drift, explica una prediccion y puntua el corte de TEST en
      # BACKTEST con su feature_known_at. El resumen y el drift salen por la linea de comandos, y el
      # desempeno de ese BACKTEST con los labels del manifiesto reproduce las metricas de TEST. Con
      # --optimizacion sigue optimization/v1 (el paso siguiente revisa su linea de comandos).
      - name: Predictive Intelligence
        run: |
          set -o pipefail
          docker compose exec -T api motor-cartera generar-escenario-predictivo datos/predictivo \
            --cuentas 600 --cortes 20 --primer-corte 2026-03-04
          docker compose exec -T -e MC_CARTERA_ID=PREDICTIVO worker motor-cartera \
            cargar-escenario-predictivo datos/predictivo | tee cargar_predictivo.txt
          grep -q "Cargados 20 cortes" cargar_predictivo.txt
          docker compose exec -T worker motor-cartera construir-manifiesto-predictivo \
            --escenario datos/predictivo --validation 1 --test 1 \
            --destino datos/predictivo/manifiesto.json | tee manifiesto_predictivo.txt
          grep -q "No se entreno nada" manifiesto_predictivo.txt
          ruteo=$(awk '/^ruteo_run_id/ {print $2}' humo.txt)
          python3 scripts/prueba_de_humo.py --predictivo datos/predictivo --optimizacion \
            --ruteo-oficial "$ruteo" | tee humo_predictivo.txt
          valor() { awk -v llave="$1" '$1 == llave {print $2}' humo_predictivo.txt; }
          docker compose exec -T worker motor-cartera resumen-modelo-predictivo \
            --modelo "$(valor modelo_version_id)" | tee resumen_predictivo.txt
          grep -q ": PUBLICADA" resumen_predictivo.txt
          test "$(grep -c "fallidas ninguna" resumen_predictivo.txt)" -eq 4
          docker compose exec -T worker motor-cartera drift-predictivo \
            --scoring "$(valor scoring_run_id)" | tee drift_predictivo.txt
          grep -q "No cambia ni reentrena el modelo" drift_predictivo.txt
          docker compose exec -T worker motor-cartera evaluar-predictivo \
            --scoring "$(valor scoring_backtest_id)" --label-known-at "$(valor label_known_at)" \
            --pagos-completos-hasta "$(valor pagos_completos_hasta)" \
            --lifecycle-completo-hasta "$(valor lifecycle_completo_hasta)" \
            --salida datos/predictivo/desempeno.json | tee desempeno_predictivo.txt
          python3 - <<'EOF'
          import json

          r = json.load(open("datos/predictivo/desempeno.json", encoding="utf-8"))
          componentes = r["componentes"]
          assert [c["estado"] for c in componentes] == ["EVALUADO"] * 4, componentes
          diferencias = [d for c in componentes for d in c["diferencias"].values() if d is not None]
          assert diferencias and max(abs(d) for d in diferencias) <= 1e-12, diferencias
          print(f"{len(diferencias)} metricas de TEST reproducidas por el BACKTEST")
          EOF

      # optimization/v1 por la linea de comandos, sobre los planes que la prueba de humo publico:
      # el resumen con su certificado, la exportacion de las asignaciones y del plan agregado en
      # CSV, Parquet y JSONL (sin un dato personal), el diagnostico de la infactible y la
      # comparacion de los dos planes. Ningun comando ejecuta una accion.
      - name: Optimizacion Matematica
        run: |
          set -o pipefail
          valor() { awk -v llave="$1" '$1 == llave {print $2}' humo_predictivo.txt; }
          plan=$(valor optimizacion_run_id)
          docker compose exec -T worker motor-cartera resumen-optimizacion --ejecucion "$plan" \
            | tee resumen_optimizacion.txt
          grep -q "EXITOSA (PLAN_PUBLICADO)" resumen_optimizacion.txt
          test "$(grep -c "): OPTIMAL, objetivo" resumen_optimizacion.txt)" -eq 4
          grep -q "No demuestra que el canal asignado cause" resumen_optimizacion.txt
          for formato in csv parquet jsonl; do
            docker compose exec -T worker motor-cartera exportar-optimizacion --ejecucion "$plan" \
              --formato "$formato" --destino "datos/optimizacion.$formato" | tee exportar.txt
            grep -q "filas de asignaciones" exportar.txt
          done
          docker compose exec -T worker motor-cartera exportar-optimizacion --ejecucion "$plan" \
            --contenido pools --destino datos/optimizacion_pools.csv
          # Con -e, un "! grep" nunca detiene el paso: se pregunta con if.
          if grep -qiE "cliente_unico|actor_ref|latitud|longitud|telefono" datos/optimizacion.csv
          then exit 1; fi
          docker compose exec -T worker motor-cartera diagnosticar-optimizacion \
            --ejecucion "$(valor optimizacion_infactible_run_id)" | tee diagnostico.txt
          grep -q "MINIMO_SUPERA_ELEGIBLES" diagnostico.txt
          grep -q "Sin plan publicado" diagnostico.txt
          docker compose exec -T worker motor-cartera comparar-optimizaciones --a "$plan" \
            --b "$(valor optimizacion_campo_run_id)" | tee comparar.txt
          grep -q "no un juicio de negocio" comparar.txt

      # El almacen de artefactos es evidencia: sobrevive a que se borren los contenedores. Se
      # bajan (sin -v, que borraria los volumenes) y se vuelven a levantar, y cada artefacto que la
      # base registra tiene que seguir en el almacen con sus mismos bytes: las carteras, los pagos
      # y sus Parquet conformados, los del escenario predictivo incluidos.
      - name: Persistencia del almacen de artefactos
        run: |
          docker compose --profile ruteo down
          docker compose up -d
          docker compose exec -T worker motor-cartera verificar-fuentes --minimo 5

      # Lo que hizo el worker: cada trabajo que tomo y como lo cerro.
      - name: Bitacora del worker
        if: always()
        run: docker compose logs worker

      - name: Bitacora de los contenedores
        if: failure()
        run: docker compose --profile ruteo logs

      - name: Apagar
        if: always()
        run: docker compose --profile ruteo down -v

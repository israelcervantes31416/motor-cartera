name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: motor
          POSTGRES_PASSWORD: motor
          POSTGRES_DB: cartera_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U motor -d cartera_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MC_DATABASE_URL: postgresql+psycopg://motor:motor@localhost:5432/cartera_test
      MC_DATABASE_URL_PRUEBAS: postgresql+psycopg://motor:motor@localhost:5432/cartera_test

    steps:
      - uses: actions/checkout@v7

      # El Python del sistema del runner esta marcado como "externally managed" (PEP 668):
      # instalar ahi con --system falla. Un entorno virtual activado evita el problema.
      # setup-uv no publica etiquetas de version mayor (no existe @v10): se fija al commit
      # de una version exacta, que ademas no se puede mover como una etiqueta.
      - name: uv y Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Dependencias
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      # Que el esquema suba desde cero, que coincida con los modelos (si alguien cambia un
      # modelo sin migracion, `alembic check` falla) y que la migracion tambien baje.
      - name: Migraciones
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      # Contra la PostgreSQL de servicio, no contra una base simulada.
      - name: Pruebas
        run: pytest --cov=motor_cartera --cov-report=term-missing

  # La definicion de terminado, en una maquina limpia: un solo comando levanta todo, se
  # genera una cartera sintetica y el flujo completo funciona por la API.
  compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: docker compose up
        run: docker compose up -d --build

      - name: Generar una cartera sintetica
        run: docker compose exec -T api motor-cartera generar --destino datos/humo.xlsx

      - name: Prueba de humo por la API
        run: python3 scripts/prueba_de_humo.py datos/humo.xlsx

      - name: Bitacora de los contenedores
        if: failure()
        run: docker compose logs

      - name: Apagar
        if: always()
        run: docker compose down -v

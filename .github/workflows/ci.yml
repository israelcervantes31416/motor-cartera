name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: motor
          POSTGRES_PASSWORD: motor
          POSTGRES_DB: cartera_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U motor -d cartera_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MC_DATABASE_URL: postgresql+psycopg://motor:motor@localhost:5432/cartera_test

    steps:
      - uses: actions/checkout@v7

      # El Python del sistema del runner esta marcado como "externally managed" (PEP 668):
      # instalar ahi con --system falla. Un entorno virtual activado evita el problema.
      - name: uv y Python 3.12
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Dependencias
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Migraciones
        run: alembic upgrade head

      - name: Pruebas
        run: pytest --cov=motor_cartera --cov-report=term-missing

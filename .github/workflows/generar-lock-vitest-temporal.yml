name: Generar lock temporal de Vitest

on:
  push:
    branches: [chore/vitest-4.1.12-security]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Regenerar solo el lock de Vitest
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --save-exact vitest@4.1.12 @vitest/coverage-v8@4.1.12

      - name: Verificar versiones corregidas
        working-directory: web
        run: |
          node -e "const p=require('./package-lock.json'); const pk=p.packages; for (const n of ['node_modules/vitest','node_modules/@vitest/coverage-v8','node_modules/@vitest/mocker']) { console.log(n, pk[n]?.version); if (pk[n]?.version !== '4.1.12') process.exit(1) }"

      - name: Guardar lock y retirar workflow temporal
        run: |
          git config user.name "Israel Cervantes Juárez"
          git config user.email "178838815+israelcervantes31416@users.noreply.github.com"
          git add web/package-lock.json
          git rm .github/workflows/generar-lock-vitest-temporal.yml
          git commit -m "build(web): actualiza lock de Vitest 4.1.12"
          git push origin HEAD:chore/vitest-4.1.12-security

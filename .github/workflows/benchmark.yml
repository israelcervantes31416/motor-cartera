name: Benchmark de escala

# Solo a mano, desde la pestana Actions: no corre en ningun push ni en ningun pull request. Mide
# un perfil grande de punta a punta contra PostgreSQL y deja la tabla en el resumen del run. Con
# tipo=escala, la ingesta de un corte (generacion, almacen, validacion, dataset conformado,
# proyeccion y persistencia); con tipo=historia, la materializacion del modelo historico de varios
# cortes y las consultas de una cuenta, con su plan; con tipo=motor_pagos, la interpretacion de los
# pagos observados de esos cortes, las llegadas tardias y las consultas de una cuenta y de un
# movimiento, con su plan; con tipo=lifecycle, ademas, la carga de los eventos operacionales de esos
# cortes, la atribucion de sus pagos, la evaluacion de sus promesas y las consultas de una cuenta,
# con su plan; con tipo=decision_v2, sobre ese mismo escenario con su lifecycle, decision/v1 y
# decision/v2 de su ultimo corte por fase, una segunda decision comparada cuenta por cuenta, la
# sombra y las consultas de una cuenta y de una pagina, con su plan; con tipo=geografia, descarga el
# Marco Geoestadistico Integrado 2025 del INEGI (y comprueba su SHA-256 contra el manifiesto), lo
# importa, y mide geografia/v1 y territorial/v2 sobre un corte de unas 500,000 cuentas sinteticas
# con coordenadas sinteticas, con el plan de cada consulta y el uso del indice espacial; con
# tipo=campo, sobre ese mismo corte, decision/v2 una vez y campo/v2 con una configuracion de campo
# sintetica declarada en el script, la estabilidad al agregar un gestor y el plan de cada consulta;
# con tipo=ruteo, ademas, ruteo/v2 sobre ese plan con un proveedor SINTETICO que no es una red vial
# (el planificador, su reconstruccion y el plan de cada consulta). La red vial real se mide a mano,
# con un extracto de OpenStreetMap y los binarios de OSRM (ver docs/ruteo_v2.md): aqui no se
# descarga OpenStreetMap.
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: "Que se mide"
        type: choice
        options: [escala, historia, motor_pagos, lifecycle, decision_v2, geografia, campo, ruteo]
        default: escala
      cortes:
        description: "Cuantos cortes (con tipo=historia, motor_pagos, lifecycle o decision_v2)"
        type: string
        default: "12"
      perfil:
        description: "Perfil de escala"
        type: choice
        options: [XS, S, M, L, XL, XXL]
        default: XL
      formato:
        description: "Formato de los archivos (xlsx de este tamano es lento por el formato)"
        type: choice
        options: [zip, csv]
        default: zip
      intensidad:
        description: "Intensidad del lifecycle (con tipo=lifecycle o decision_v2): 0.5 en el XL, unos 2.5 millones de eventos"
        type: string
        default: "0.5"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: motor
          POSTGRES_PASSWORD: motor
          POSTGRES_DB: cartera_bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U motor -d cartera_bench"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MC_DATABASE_URL: postgresql+psycopg://motor:motor@localhost:5432/cartera_bench
      PERFIL: ${{ inputs.perfil }}
      FORMATO: ${{ inputs.formato }}
      CORTES: ${{ inputs.cortes }}

    steps:
      - uses: actions/checkout@v7

      - name: uv y Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
          activate-environment: true

      # Con las de desarrollo: las consultas de los benchmarks van por el TestClient de la API, que
      # necesita httpx2.
      - name: Dependencias
        run: uv sync --locked --extra dev

      # Los archivos y el almacen, en el disco temporal del runner: nada de esto se sube.
      - name: Benchmark
        if: inputs.tipo == 'escala'
        run: |
          python scripts/benchmark_escala.py --perfil "$PERFIL" --formato "$FORMATO" \
            --destino "$RUNNER_TEMP/benchmark" --salida "$RUNNER_TEMP/benchmark.json" \
            | tee "$RUNNER_TEMP/benchmark.md"
          {
            echo "## Benchmark de escala: perfil $PERFIL en $FORMATO"
            echo
            grep '^|' "$RUNNER_TEMP/benchmark.md"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/benchmark.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MC_SOURCE_STORE_ROOT: ${{ runner.temp }}/almacen

      - name: Benchmark del modelo historico
        if: inputs.tipo == 'historia'
        run: |
          python scripts/benchmark_historia.py --perfil "$PERFIL" --cortes "$CORTES" \
            --formato "$FORMATO" --destino "$RUNNER_TEMP/historia" \
            --salida "$RUNNER_TEMP/historia/benchmark_historia.json" \
            | tee "$RUNNER_TEMP/benchmark_historia.log"
          {
            echo "## Benchmark del modelo historico: $CORTES cortes del perfil $PERFIL en $FORMATO"
            echo
            cat "$RUNNER_TEMP/historia/benchmark_historia.md"
            echo
            echo '<details><summary>Planes (EXPLAIN ANALYZE, BUFFERS)</summary>'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/historia/planes.txt"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MC_SOURCE_STORE_ROOT: ${{ runner.temp }}/almacen

      - name: Benchmark del motor de pagos
        if: inputs.tipo == 'motor_pagos'
        run: |
          python scripts/benchmark_motor_pagos.py --perfil "$PERFIL" --cortes "$CORTES" \
            --formato "$FORMATO" --destino "$RUNNER_TEMP/motor_pagos" \
            --salida "$RUNNER_TEMP/motor_pagos/benchmark_motor_pagos.json" \
            | tee "$RUNNER_TEMP/benchmark_motor_pagos.log"
          {
            echo "## Benchmark del motor de pagos: $CORTES cortes del perfil $PERFIL en $FORMATO"
            echo
            cat "$RUNNER_TEMP/motor_pagos/benchmark_motor_pagos.md"
            echo
            echo '<details><summary>Planes (EXPLAIN ANALYZE, BUFFERS)</summary>'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/motor_pagos/planes_motor_pagos.txt"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MC_SOURCE_STORE_ROOT: ${{ runner.temp }}/almacen

      - name: Benchmark del lifecycle y de la atribucion
        if: inputs.tipo == 'lifecycle'
        run: |
          python scripts/benchmark_motor_pagos.py --perfil "$PERFIL" --cortes "$CORTES" \
            --formato "$FORMATO" --destino "$RUNNER_TEMP/motor_pagos" \
            --salida "$RUNNER_TEMP/motor_pagos/benchmark_motor_pagos.json" \
            | tee "$RUNNER_TEMP/benchmark_motor_pagos.log"
          python scripts/benchmark_lifecycle.py --escenario "$RUNNER_TEMP/motor_pagos" \
            --destino "$RUNNER_TEMP/lifecycle" --intensidad "$INTENSIDAD" \
            | tee "$RUNNER_TEMP/benchmark_lifecycle.log"
          {
            echo "## Benchmark del lifecycle: $CORTES cortes del perfil $PERFIL, intensidad $INTENSIDAD"
            echo
            cat "$RUNNER_TEMP/lifecycle/benchmark_lifecycle.md"
            echo
            echo '<details><summary>Planes (EXPLAIN ANALYZE, BUFFERS)</summary>'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/lifecycle/planes_lifecycle.txt"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MC_SOURCE_STORE_ROOT: ${{ runner.temp }}/almacen
          INTENSIDAD: ${{ inputs.intensidad }}

      - name: Benchmark de decision/v2
        if: inputs.tipo == 'decision_v2'
        run: |
          python scripts/benchmark_motor_pagos.py --perfil "$PERFIL" --cortes "$CORTES" \
            --formato "$FORMATO" --destino "$RUNNER_TEMP/motor_pagos" \
            --salida "$RUNNER_TEMP/motor_pagos/benchmark_motor_pagos.json" \
            | tee "$RUNNER_TEMP/benchmark_motor_pagos.log"
          python scripts/benchmark_lifecycle.py --escenario "$RUNNER_TEMP/motor_pagos" \
            --destino "$RUNNER_TEMP/lifecycle" --intensidad "$INTENSIDAD" \
            | tee "$RUNNER_TEMP/benchmark_lifecycle.log"
          python scripts/benchmark_decision_v2.py --destino "$RUNNER_TEMP/decision_v2" \
            | tee "$RUNNER_TEMP/benchmark_decision_v2.log"
          {
            echo "## Benchmark de decision/v2: el ultimo de $CORTES cortes del perfil $PERFIL"
            echo
            cat "$RUNNER_TEMP/decision_v2/benchmark_decision_v2.md"
            echo
            echo '<details><summary>Planes (EXPLAIN ANALYZE, BUFFERS)</summary>'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/decision_v2/planes_decision_v2.txt"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MC_SOURCE_STORE_ROOT: ${{ runner.temp }}/almacen
          INTENSIDAD: ${{ inputs.intensidad }}

      # El archivo oficial se descarga aqui, a mano y fuera del repositorio, y se comprueba contra
      # el SHA-256 del manifiesto antes de importarlo. Las cuentas son sinteticas.
      - name: Benchmark de geografia/v1 y territorial/v2
        if: inputs.tipo == 'geografia' || inputs.tipo == 'campo' || inputs.tipo == 'ruteo'
        run: |
          mkdir -p "$RUNNER_TEMP/inegi"
          url=$(python -c "import json; print(json.load(open('src/motor_cartera/geografia/referencias.json'))['referencias']['inegi-mg-2025-municipal']['url'])")
          sha=$(python -c "import json; print(json.load(open('src/motor_cartera/geografia/referencias.json'))['referencias']['inegi-mg-2025-municipal']['sha256'])")
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/inegi/mg_2025_integrado.zip" "$url"
          echo "$sha  $RUNNER_TEMP/inegi/mg_2025_integrado.zip" | sha256sum -c -
          python scripts/benchmark_geografia.py --destino "$RUNNER_TEMP/geografia" \
            --referencia "$RUNNER_TEMP/inegi/mg_2025_integrado.zip" \
            | tee "$RUNNER_TEMP/benchmark_geografia.log"
          {
            echo "## Benchmark de geografia/v1 y territorial/v2"
            echo
            cat "$RUNNER_TEMP/geografia/benchmark_geografia.md"
            echo
            echo '<details><summary>Planes (EXPLAIN ANALYZE, BUFFERS)</summary>'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/geografia/planes_geografia_espaciales.txt"
            cat "$RUNNER_TEMP/geografia/planes_geografia.txt"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MC_SOURCE_STORE_ROOT: ${{ runner.temp }}/almacen

      # campo/v2 sobre el corte que dejo el benchmark de geografia, en la misma base: su decision/v2
      # se toma una sola vez, y la configuracion de campo la declara el script antes de planear.
      - name: Benchmark de campo/v2
        if: inputs.tipo == 'campo' || inputs.tipo == 'ruteo'
        run: |
          python scripts/benchmark_campo.py --destino "$RUNNER_TEMP/campo" \
            | tee "$RUNNER_TEMP/benchmark_campo.log"
          {
            echo "## Benchmark de campo/v2"
            echo
            cat "$RUNNER_TEMP/campo/benchmark_campo.md"
            echo
            echo '<details><summary>Planes (EXPLAIN ANALYZE, BUFFERS)</summary>'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/campo/planes_campo.txt"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MC_SOURCE_STORE_ROOT: ${{ runner.temp }}/almacen

      # ruteo/v2 sobre el plan A del benchmark de campo/v2, en la misma base, con el proveedor
      # SINTETICO que declara el script: mide el planificador y la publicacion, no una red vial.
      - name: Benchmark de ruteo/v2 (el planificador)
        if: inputs.tipo == 'ruteo'
        run: |
          plan=$(python -c "import json, sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['plan_a']['campo_run_id'])" "$RUNNER_TEMP/campo/benchmark_campo.json")
          python scripts/benchmark_ruteo.py planificador --destino "$RUNNER_TEMP/ruteo" \
            --plan "$plan" | tee "$RUNNER_TEMP/benchmark_ruteo.log"
          {
            echo "## Benchmark de ruteo/v2: el planificador, con un proveedor SINTETICO (no es una red vial)"
            echo
            cat "$RUNNER_TEMP/ruteo/benchmark_ruteo_planificador.md"
            echo
            echo '<details><summary>Planes (EXPLAIN ANALYZE, BUFFERS)</summary>'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/ruteo/planes_ruteo.txt"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MC_SOURCE_STORE_ROOT: ${{ runner.temp }}/almacen

name: Benchmark de escala

# Solo a mano, desde la pestana Actions: no corre en ningun push ni en ningun pull request. Mide
# un perfil grande de punta a punta contra PostgreSQL y deja la tabla en el resumen del run. Con
# tipo=escala, la ingesta de un corte (generacion, almacen, validacion, dataset conformado,
# proyeccion y persistencia); con tipo=historia, la materializacion del modelo historico de varios
# cortes y las consultas de una cuenta, con su plan; con tipo=motor_pagos, la interpretacion de los
# pagos observados de esos cortes, las llegadas tardias y las consultas de una cuenta y de un
# movimiento, con su plan.
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: "Que se mide"
        type: choice
        options: [escala, historia, motor_pagos]
        default: escala
      cortes:
        description: "Cuantos cortes (con tipo=historia o tipo=motor_pagos)"
        type: string
        default: "12"
      perfil:
        description: "Perfil de escala"
        type: choice
        options: [XS, S, M, L, XL, XXL]
        default: XL
      formato:
        description: "Formato de los archivos (xlsx de este tamano es lento por el formato)"
        type: choice
        options: [zip, csv]
        default: zip

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: motor
          POSTGRES_PASSWORD: motor
          POSTGRES_DB: cartera_bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U motor -d cartera_bench"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MC_DATABASE_URL: postgresql+psycopg://motor:motor@localhost:5432/cartera_bench
      PERFIL: ${{ inputs.perfil }}
      FORMATO: ${{ inputs.formato }}
      CORTES: ${{ inputs.cortes }}

    steps:
      - uses: actions/checkout@v7

      - name: uv y Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
          activate-environment: true

      - name: Dependencias
        run: uv sync --locked

      # Los archivos y el almacen, en el disco temporal del runner: nada de esto se sube.
      - name: Benchmark
        if: inputs.tipo == 'escala'
        run: |
          python scripts/benchmark_escala.py --perfil "$PERFIL" --formato "$FORMATO" \
            --destino "$RUNNER_TEMP/benchmark" --salida "$RUNNER_TEMP/benchmark.json" \
            | tee "$RUNNER_TEMP/benchmark.md"
          {
            echo "## Benchmark de escala: perfil $PERFIL en $FORMATO"
            echo
            grep '^|' "$RUNNER_TEMP/benchmark.md"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/benchmark.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MC_SOURCE_STORE_ROOT: ${{ runner.temp }}/almacen

      - name: Benchmark del modelo historico
        if: inputs.tipo == 'historia'
        run: |
          python scripts/benchmark_historia.py --perfil "$PERFIL" --cortes "$CORTES" \
            --formato "$FORMATO" --destino "$RUNNER_TEMP/historia" \
            --salida "$RUNNER_TEMP/historia/benchmark_historia.json" \
            | tee "$RUNNER_TEMP/benchmark_historia.log"
          {
            echo "## Benchmark del modelo historico: $CORTES cortes del perfil $PERFIL en $FORMATO"
            echo
            cat "$RUNNER_TEMP/historia/benchmark_historia.md"
            echo
            echo '<details><summary>Planes (EXPLAIN ANALYZE, BUFFERS)</summary>'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/historia/planes.txt"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MC_SOURCE_STORE_ROOT: ${{ runner.temp }}/almacen

      - name: Benchmark del motor de pagos
        if: inputs.tipo == 'motor_pagos'
        run: |
          python scripts/benchmark_motor_pagos.py --perfil "$PERFIL" --cortes "$CORTES" \
            --formato "$FORMATO" --destino "$RUNNER_TEMP/motor_pagos" \
            --salida "$RUNNER_TEMP/motor_pagos/benchmark_motor_pagos.json" \
            | tee "$RUNNER_TEMP/benchmark_motor_pagos.log"
          {
            echo "## Benchmark del motor de pagos: $CORTES cortes del perfil $PERFIL en $FORMATO"
            echo
            cat "$RUNNER_TEMP/motor_pagos/benchmark_motor_pagos.md"
            echo
            echo '<details><summary>Planes (EXPLAIN ANALYZE, BUFFERS)</summary>'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/motor_pagos/planes_motor_pagos.txt"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MC_SOURCE_STORE_ROOT: ${{ runner.temp }}/almacen

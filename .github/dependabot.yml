# Las actualizaciones de dependencias: Dependabot abre sus PRs, y el CI completo (pruebas,
# auditorias, la prueba de humo y Trivy) decide. Cada fuente espera 7 dias despues de una version
# nueva antes de proponerla: una version comprometida suele descubrirse en esos dias.
#
# Los menores y los parches de Python y de la app web llegan juntos, en un PR por ecosistema; cada
# mayor llega en su propio PR, porque es una migracion que se decide aparte
# (docs/dependencias-v1.md). Ningun mayor se ignora. Las actualizaciones de seguridad no esperan el
# cooldown y llegan cada una en su PR.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      web:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Los digests de las imagenes base (FROM) y de las del compose: se fijan por digest y Dependabot
  # propone el digest nuevo de la misma etiqueta.
  - package-ecosystem: docker
    directories: ["/", "/web", "/infra/respaldo"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: terraform
    directory: /infra/gcp
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

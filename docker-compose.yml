# `docker compose up` levanta PostgreSQL, aplica las migraciones y arranca la API y el worker,
# en ese orden y sin pasos manuales. La API queda en http://localhost:8000 (documentacion en
# /docs). La API guarda cada archivo en el almacen de artefactos y registra el trabajo en la cola
# durable, en PostgreSQL; el worker lo ejecuta.

x-app: &app
  build: .
  image: motor-cartera:dev
  environment:
    MC_DATABASE_URL: postgresql+psycopg://motor:motor@postgres:5432/cartera_dev
    MC_DATABASE_URL_PRUEBAS: postgresql+psycopg://motor:motor@postgres:5432/cartera_test
    # Clave solo para desarrollo local. En cualquier otro entorno MC_API_KEY se define
    # fuera del repositorio; la API se niega a arrancar sin una.
    MC_API_KEY: ${MC_API_KEY:-clave-local-de-desarrollo}
    # El almacen de artefactos fuente: cada archivo recibido, por su SHA-256, sin borrarse nunca. La
    # API lo escribe y el worker lo lee; es un volumen propio, aparte del de PostgreSQL.
    MC_SOURCE_STORE_ROOT: /var/lib/motor-cartera/fuentes
  volumes:
    - ./:/app
    - fuentes:/var/lib/motor-cartera/fuentes

services:
  postgres:
    image: postgres:16-alpine
    container_name: motor-cartera-postgres
    environment:
      POSTGRES_USER: motor
      POSTGRES_PASSWORD: motor
      POSTGRES_DB: cartera_dev
    ports:
      # 5434 a proposito: 5432 suele estar ocupado y 5433 lo usa otro proyecto.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motor -d cartera_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrar es un paso propio y no un efecto del arranque de la API: si las migraciones
  # fallan, la API no arranca sobre un esquema a medias, y con varias replicas de la API
  # no competirian por migrar a la vez.
  migraciones:
    <<: *app
    container_name: motor-cartera-migraciones
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    container_name: motor-cartera-api
    depends_on:
      migraciones:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command:
      ["uvicorn", "--factory", "motor_cartera.api.app:crear_app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  # La misma imagen, el mismo codigo y la misma base que la API, en otro contenedor y sin puertos:
  # la API atiende HTTP y el worker ejecuta los trabajos de la cola. Ninguno guarda trabajo en
  # memoria. Si la API se reinicia, lo que registro sigue en PostgreSQL; si el worker se cae, se
  # reinicia y retoma la cola, y un trabajo que dejo a medias vuelve a tomarse cuando vence su
  # lease. Sin container_name, para poder correr varios (`docker compose up --scale worker=3`):
  # nunca toman el mismo trabajo.
  worker:
    <<: *app
    depends_on:
      migraciones:
        condition: service_completed_successfully
    command: ["motor-cartera", "worker"]
    restart: unless-stopped
    # Con SIGTERM termina el trabajo en curso y sale. Si tarda mas que esto, Docker lo mata y el
    # trabajo vuelve a la cola cuando vence su lease.
    stop_grace_period: 30s

volumes:
  pgdata:
  # Sobrevive a `docker compose down` (no a `down -v`): los artefactos son evidencia.
  fuentes:

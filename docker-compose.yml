# El compose de DESARROLLO. `docker compose up` levanta PostgreSQL, aplica las migraciones y
# arranca la API, el worker y la app web, en ese orden y sin pasos manuales. La API queda en
# http://localhost:8000 (documentacion en /docs) y la app en http://localhost:8080. La API guarda
# cada archivo en el almacen de artefactos y registra el trabajo en la cola durable, en PostgreSQL;
# el worker lo ejecuta.
#
# Es una conveniencia explicita de una maquina de desarrollo (MC_APP_ENV=development): la clave de
# desarrollo que vale para todo, la documentacion de la API, la base con su contrasena de siempre y
# sus puertos en el host. Nada de esto arranca en produccion: el despliegue de produccion local es
# docker-compose.production.yml (ver docs/production.md).

x-app: &app
  build:
    context: .
    target: desarrollo
  image: motor-cartera:dev
  environment:
    # Desarrollo, declarado: sin esto la configuracion se comporta como produccion y falla cerrada.
    MC_APP_ENV: development
    MC_DATABASE_URL: postgresql+psycopg://motor:motor@postgres:5432/cartera_dev
    MC_DATABASE_URL_PRUEBAS: postgresql+psycopg://motor:motor@postgres:5432/cartera_test
    # Clave solo para desarrollo local. En cualquier otro entorno MC_API_KEY se define
    # fuera del repositorio; la API se niega a arrancar sin una.
    MC_API_KEY: ${MC_API_KEY:-clave-local-de-desarrollo}
    # El almacen de artefactos fuente: cada archivo recibido, por su SHA-256, sin borrarse nunca. La
    # API lo escribe y el worker lo lee; es un volumen propio, aparte del de PostgreSQL.
    MC_SOURCE_STORE_ROOT: /var/lib/motor-cartera/fuentes
    # El proveedor de ruteo de ruteo/v2: el OSRM de abajo, en la red interna. Mientras no responde
    # (su perfil no se levanto, o todavia carga la red), el worker no toma trabajos RUTEO_V2 y sigue
    # con los demas.
    MC_OSRM_URL: http://osrm:5000
  volumes:
    - ./:/app
    - fuentes:/var/lib/motor-cartera/fuentes

services:
  postgres:
    # PostgreSQL 16 con PostGIS 3.5: la geografia (v0.11) guarda los municipios y los puntos con
    # sus indices GiST. La misma version mayor de PostgreSQL de siempre: el volumen de datos sirve.
    image: postgis/postgis:16-3.5-alpine@sha256:47e961a569fd52ff31f0fe205ed91eeab17d9f5fff6722e6d7ea6b588748b293
    container_name: motor-cartera-postgres
    environment:
      POSTGRES_USER: motor
      POSTGRES_PASSWORD: motor
      POSTGRES_DB: cartera_dev
    ports:
      # 5434 a proposito: 5432 suele estar ocupado y 5433 lo usa otro proyecto.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motor -d cartera_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrar es un paso propio y no un efecto del arranque de la API: si las migraciones
  # fallan, la API no arranca sobre un esquema a medias, y con varias replicas de la API
  # no competirian por migrar a la vez.
  migraciones:
    <<: *app
    container_name: motor-cartera-migraciones
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    container_name: motor-cartera-api
    depends_on:
      migraciones:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command:
      ["uvicorn", "--factory", "motor_cartera.api.app:crear_app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  # La misma imagen, el mismo codigo y la misma base que la API, en otro contenedor y sin puertos:
  # la API atiende HTTP y el worker ejecuta los trabajos de la cola. Ninguno guarda trabajo en
  # memoria. Si la API se reinicia, lo que registro sigue en PostgreSQL; si el worker se cae, se
  # reinicia y retoma la cola, y un trabajo que dejo a medias vuelve a tomarse cuando vence su
  # lease. Sin container_name, para poder correr varios (`docker compose up --scale worker=3`):
  # nunca toman el mismo trabajo.
  worker:
    <<: *app
    depends_on:
      migraciones:
        condition: service_completed_successfully
    command: ["motor-cartera", "worker"]
    restart: unless-stopped
    # Con SIGTERM termina el trabajo en curso y sale. Si tarda mas que esto, Docker lo mata y el
    # trabajo vuelve a la cola cuando vence su lease.
    stop_grace_period: 30s

  # La superficie web (v0.17): el build de la SPA servido por nginx en http://localhost:8080, con un
  # proxy de solo lectura hacia la API en el mismo origen (solo GET, solo las rutas de
  # web/nginx/rutas-api.conf). La clave de la API la pone nginx: el navegador nunca la ve. Publicado
  # solo en 127.0.0.1: en desarrollo no tiene usuarios. La de produccion, con TLS y sesion OIDC, es
  # la del compose de produccion.
  web:
    build: ./web
    image: motor-cartera-web:dev
    container_name: motor-cartera-web
    environment:
      MC_API_KEY: ${MC_API_KEY:-clave-local-de-desarrollo}
      MC_API_UPSTREAM: api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/salud-web"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # El proveedor de ruteo de ruteo/v2: OSRM v26.9.0 autoalojado, con la imagen fijada por su digest
  # (la misma con que preparar.sh prepara la red). Sirve la red de MC_RED_VIAL_HUELLA, preparada en
  # datos/red_vial/<huella> por `motor-cartera preparar-red-vial --docker` y su preparar.sh, y la
  # declara en cada respuesta. Sin puerto publicado: solo la API y el worker lo ven, y las
  # coordenadas de las cuentas no salen de la red interna. --verbosity WARNING porque su bitacora de
  # accesos (INFO) repite cada peticion, con sus coordenadas. Va en el perfil `ruteo`: se levanta
  # con `docker compose --profile ruteo up -d osrm` cuando la red ya esta preparada.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:26.10.0-debian@sha256:55dbfd47d984c2cacd64e32901b4321c86b5ec761438e69aa053dc78698a786f
    profiles: ["ruteo"]
    command:
      - osrm-routed
      - --algorithm
      - mld
      - --verbosity
      - WARNING
      - --max-nearest-locations
      - "100"
      - /redes/${MC_RED_VIAL_HUELLA:-sin-red}/red.osrm
    volumes:
      - ./datos/red_vial:/redes:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # El respaldo oficial (scripts/respaldo.py): la base y el almacen de artefactos, juntos, en un
  # directorio nuevo bajo ./respaldos. `docker compose --profile respaldo run --rm respaldo` hace
  # uno; como restaurarlo en un entorno nuevo lo dice docs/backups.md.
  respaldo:
    build:
      context: .
      dockerfile: infra/respaldo/Dockerfile
    image: motor-cartera-respaldo:local
    profiles: ["respaldo"]
    command: ["respaldar", "--destino", "/respaldos"]
    # El dueno de los archivos de respaldo en el host: en Linux, el usuario que corre el compose.
    user: "${MC_RESPALDO_USUARIO:-70:70}"
    environment:
      MC_RESPALDO_DSN: postgresql://motor:motor@postgres:5432/cartera_dev
      MC_SOURCE_STORE_ROOT: /var/lib/motor-cartera/fuentes
    volumes:
      - fuentes:/var/lib/motor-cartera/fuentes:ro
      - ${MC_RESPALDOS_DIR:-./respaldos}:/respaldos
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  # Sobrevive a `docker compose down` (no a `down -v`): los artefactos son evidencia.
  fuentes:

# El colector de OpenTelemetry del perfil observabilidad: recibe las trazas de la API y del worker
# por OTLP/HTTP, quita lo que pudiera llevar un dato (defensa en profundidad: la API ya no lo
# manda), decide que trazas guardar y las envia a Jaeger.
#
# Muestreo por cola: se guardan siempre las trazas con error y las lentas (mas de 1 s), y de las
# demas el porcentaje de MC_OTEL_PORCENTAJE (100 en local; la referencia de produccion usa 10). Por
# eso la API muestrea 100 % por cabeza cuando hay colector: la decision la toma aqui, viendo la traza
# entera.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  attributes/privacidad:
    actions:
      - key: url.path
        action: delete
      - key: url.query
        action: delete
      - key: url.full
        action: delete
      - key: http.target
        action: delete
      - key: http.url
        action: delete
      - key: db.statement
        action: delete
      - key: db.query.text
        action: delete
      - key: client.address
        action: delete
      - key: user_agent.original
        action: delete
  tail_sampling:
    decision_wait: 5s
    num_traces: 20000
    expected_new_traces_per_sec: 200
    policies:
      - name: errores
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: lentas
        type: latency
        latency:
          threshold_ms: 1000
      - name: muestra
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:MC_OTEL_PORCENTAJE:-100}
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacidad, tail_sampling, batch]
      exporters: [otlp_grpc/jaeger]

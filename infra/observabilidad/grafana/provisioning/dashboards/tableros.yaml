# Los tableros de Grafana se cargan de archivos versionados (infra/observabilidad/grafana/dashboards):
# un cambio hecho en la interfaz no se guarda.
apiVersion: 1

providers:
  - name: motor-cartera
    folder: Motor Cartera
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana-dashboards
      foldersFromFilesStructure: false

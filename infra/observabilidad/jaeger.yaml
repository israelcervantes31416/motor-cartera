# Jaeger v2 del perfil observabilidad: recibe del colector por OTLP y guarda en memoria, con tope.
# Local y efimero: al reiniciarse, las trazas se pierden. La referencia de produccion usa Cloud Trace
# (docs/cloud-gcp.md).

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs:
      level: warn

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
  jaeger_query:
    storage:
      traces: memoria
    http:
      endpoint: 0.0.0.0:16686
  jaeger_storage:
    backends:
      memoria:
        memory:
          max_traces: 20000

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  jaeger_storage_exporter:
    trace_storage: memoria

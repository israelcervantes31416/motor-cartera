# Prometheus del perfil observabilidad: consulta las metricas de la API y del worker en sus puertos
# internos (nunca por el edge), las del colector y las suyas. Las reglas de alertamiento estan en
# alertas.yml y las alertas van a Alertmanager, que no envia nada fuera.
#
# La API y el worker se descubren por DNS: con varias replicas (docker compose up --scale worker=3)
# cada una es su propio objetivo.

global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 9464
        refresh_interval: 15s

  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9465
        refresh_interval: 15s

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

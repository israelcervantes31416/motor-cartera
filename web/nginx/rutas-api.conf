# Las rutas de la API que la superficie web deja pasar, solo con GET: la lista blanca de su
# proxy. Es la unica fuente: nginx la incluye en su `map`, el servidor de desarrollo y el de
# preview de Vite la leen (proxy-api.ts), scripts/exportar_contrato_web.py exporta el contrato
# OpenAPI de la web con las rutas que deja pasar, y tests/test_superficie_web.py comprueba que
# ninguna de esas rutas responde un dato personal.
#
# Una linea por expresion, contra la ruta ya normalizada ($uri, sin la query string), entre
# comillas: nginx exige comillas en una expresion con llaves.
#   "~<expresion>"  1;
# Lo que no esta aqui responde 404 sin llegar a la API. Analytics, Predictive y Optimization se
# leen tal cual: sus respuestas no llevan un dato personal. Campo y ruteo, solo sus planes, sus
# cargas, sus ejecuciones y sus rutas; sus asignaciones y sus paradas llevan el CLIENTE_UNICO de
# cada cuenta, y la app las lee por app/v1, sin el.

"~^/api/salud$"                                              1;
"~^/api/app/v1/"                                             1;
"~^/api/analytics/"                                          1;
"~^/api/predictivo/"                                         1;
"~^/api/optimizacion/"                                       1;
"~^/api/campo-v2/planes/[0-9a-fA-F-]{36}$"                   1;
"~^/api/campo-v2/planes/[0-9a-fA-F-]{36}/cargas$"            1;
"~^/api/ruteo-v2/ejecuciones/[0-9a-fA-F-]{36}$"              1;
"~^/api/ruteo-v2/ejecuciones/[0-9a-fA-F-]{36}/rutas$"        1;
"~^/api/ruteo-v2/rutas/[0-9a-fA-F-]{36}$"                    1;

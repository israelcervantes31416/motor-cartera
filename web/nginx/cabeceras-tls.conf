# Las cabeceras del perfil de produccion, que solo existe con TLS: las de siempre y HSTS. HSTS nunca
# en desarrollo: en http://localhost obligaria al navegador a usar https en todo localhost. El
# compose de produccion local sirve en motor-cartera.localhost, asi que tampoco toca localhost.
include /etc/nginx/cabeceras.conf;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

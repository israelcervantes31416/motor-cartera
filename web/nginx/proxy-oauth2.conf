# Como el edge le pasa una peticion del navegador a oauth2-proxy (inicio de sesion, callback y cierre
# de sesion). oauth2-proxy confia en X-Forwarded-* solo desde la red de identidad (--trusted-proxy-ip).
proxy_pass http://oauth2_proxy;
proxy_set_header Host $host;
proxy_set_header X-Request-ID $request_id;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Uri $request_uri;
proxy_set_header Authorization "";
proxy_set_header X-API-Key "";
proxy_set_header X-MC-Gateway "";
proxy_connect_timeout 3s;
proxy_read_timeout 15s;
proxy_send_timeout 15s;
# La cookie de sesion puede ocupar varias partes: las cabeceras de la respuesta caben.
proxy_buffer_size 16k;
proxy_buffers 8 16k;

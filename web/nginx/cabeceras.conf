# Las cabeceras de seguridad de cada respuesta de la superficie web, en desarrollo y en produccion.
# nginx no hereda un add_header del servidor en una location que tiene los suyos: cada location lo
# incluye.
#
# CSP: todo del mismo origen, sin `unsafe-inline` ni `unsafe-eval`. Las graficas (Recharts) y React
# ponen estilos por el CSSOM (element.style), que la CSP no bloquea; la app no tiene <style> ni
# style="" en su HTML. `img-src data:` por los iconos que Vite incrusta en el CSS.
#
# Referrer-Policy same-origin y no no-referrer: con no-referrer el navegador manda `Origin: null`
# en un POST del mismo origen (Fetch, "serializing a request origin"), y cerrar sesion, que el
# edge acepta solo con el Origin de la app, fallaria. A otro origen no se manda nada.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# El request_id que el edge genero para esta peticion (el de la API, si llego a ella, es el mismo):
# con el se encuentra su linea en la bitacora.
add_header X-Request-ID $request_id always;
